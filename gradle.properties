org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The oldest app (versionCode) the calculator updates published now still work with. Raise it when
# the calculator starts needing something only a newer app has; older apps then keep their calculator
# until the app itself is updated.
pcalc.calcMinApp=5
