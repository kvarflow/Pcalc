name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release for the versionName in app/build.gradle.kts (run on main)"
        type: boolean
        default: false

# Read-only unless a job asks for more (only the release job does).
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # The sprite set has non-ASCII file names (Flabébé); Java needs a UTF-8 locale to read them.
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      # Actions are pinned to exact commits (the comment says which release), so a moved tag can't
      # change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false

      # The calculator, at the rr-calc commit the submodule pins.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 18
      - name: Build the calculator (rr-calc)
        working-directory: rr-calc
        run: |
          # Packages come from the lockfiles with their install scripts off. rr-calc's install
          # scripts would also run calc's "bundle" step, which the pages don't use and which fails
          # on a fresh install; compile the engine the pages load instead.
          npm ci --ignore-scripts --no-audit --no-fund
          (cd calc && npm ci --ignore-scripts --no-audit --no-fund && npx tsc -p .)
          node build

      # The app.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Checks gradle/wrapper/gradle-wrapper.jar is an official Gradle release before running it.
          validate-wrappers: true
      - name: Test and build APK
        # packRemoteAssets checks every downloaded image against app/remote-assets.lock.
        run: ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pcalc-unsigned-for-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7

      # Builds that aren't releases keep the sideload signature: fine for trying a branch, but they
      # won't install over a release once releases are signed with the release key.
      - name: Name the APK
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Pcalc-${version}-${GITHUB_SHA::7}.apk"
          echo "APK=Pcalc-${version}-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Pcalc-apk
          path: ${{ env.APK }}

  # A release is published either by pushing a v<versionName> tag, or by running this workflow by
  # hand on main with "release" ticked, which creates the tag itself. Versions with a suffix
  # (-beta.N) are marked pre-release. Only this job sees the signing key or can write to the repo.
  release:
    needs: apk
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Pcalc-unsigned-for-release

      # Signing: with the release key from the repository secrets, through Android's key rotation
      # (the old sideload key vouches for the release key and loses the right to replace the app),
      # so phones with an earlier build update in place and keep their data. Without the secrets
      # (before they are set up) the release keeps the sideload signature, as before.
      - name: Sign with the release key
        env:
          RELEASE_KEYSTORE: ${{ secrets.PCALC_RELEASE_KEYSTORE }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.PCALC_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          if [ -z "$RELEASE_KEYSTORE" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::warning::No release key in the repository secrets: this release keeps the sideload signature. See README, Signing."
            echo "SIGNED_WITH=sideload" >> "$GITHUB_ENV"
            exit 0
          fi
          umask 077
          echo "$RELEASE_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$apksigner" rotate --out "$RUNNER_TEMP/lineage.bin" \
            --old-signer --ks keystore/pcalc-sideload.jks --ks-pass pass:pcalc-sideload --ks-key-alias pcalc \
              --set-installed-data true --set-shared-uid true --set-permission true --set-auth true \
              --set-rollback false \
            --new-signer --ks "$RUNNER_TEMP/release.jks" --ks-pass env:RELEASE_KEYSTORE_PASSWORD --ks-key-alias pcalc-release
          "$apksigner" sign --in app-release.apk --out signed.apk \
            --min-sdk-version 28 --rotation-min-sdk-version 28 --lineage "$RUNNER_TEMP/lineage.bin" \
            --ks keystore/pcalc-sideload.jks --ks-pass pass:pcalc-sideload --ks-key-alias pcalc \
            --next-signer --ks "$RUNNER_TEMP/release.jks" --ks-pass env:RELEASE_KEYSTORE_PASSWORD --ks-key-alias pcalc-release
          rm -f "$RUNNER_TEMP/release.jks"
          mv signed.apk app-release.apk
          echo "SIGNED_WITH=release" >> "$GITHUB_ENV"

      # Refuse to publish an APK whose signature isn't what we expect.
      - name: Check the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$apksigner" verify --print-certs app-release.apk | tee certs.txt
          if [ "$SIGNED_WITH" = release ]; then
            if grep -q "certificate DN: CN=Pcalc sideload" certs.txt; then echo "::error::Not signed with the release key"; exit 1; fi
            "$apksigner" lineage --in app-release.apk --print-certs | tee lineage.txt
            grep -q "Has rollback capability      : false" lineage.txt || { echo "::error::The old key can still replace the app"; exit 1; }
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            if [ "${GITHUB_REF_NAME}" != "$tag" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} doesn't match versionName $version"; exit 1
            fi
            where="--verify-tag"
          else
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "::error::Release $tag already exists: raise versionName first"; exit 1
            fi
            where="--target ${GITHUB_SHA}"
          fi
          cp app-release.apk "Pcalc-${version}.apk"
          sha256sum "Pcalc-${version}.apk" > "Pcalc-${version}.apk.sha256"
          flags=""
          case "$version" in *-*) flags="--prerelease";; esac
          gh release create "$tag" "Pcalc-${version}.apk" "Pcalc-${version}.apk.sha256" $flags $where \
            --title "Pcalc ${version}" \
            --notes "Pcalc ${version}, with rr-calc $(git ls-tree HEAD rr-calc | awk '{print substr($3, 1, 7)}'). Signed with the ${SIGNED_WITH} key. Download Pcalc-${version}.apk on the device and open it to install."
