name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # The calculator, at the rr-calc commit the submodule pins.
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Build the calculator (rr-calc)
        working-directory: rr-calc
        run: |
          # rr-calc's install scripts also run calc's "bundle" step, which the pages don't use and
          # which currently fails on a fresh install; compile the engine the pages load instead.
          npm ci --ignore-scripts --no-audit --no-fund
          (cd calc && npm ci --ignore-scripts --no-audit --no-fund && npx tsc -p .)
          node build

      # The app.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Name the APK
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "Pcalc-${version}-${GITHUB_SHA::7}.apk"
          echo "APK=Pcalc-${version}-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Pcalc-apk
          path: ${{ env.APK }}

      # A version tag (v0.1.0-beta.1, v0.2.0, ...) publishes a release with the APK. Tags with a
      # suffix (-beta.N) are marked pre-release. The tag must match versionName in app/build.gradle.kts.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag doesn't match versionName $version"; exit 1
          fi
          cp "$APK" "Pcalc-${version}.apk"
          flags=""
          case "$version" in *-*) flags="--prerelease";; esac
          gh release create "$tag" "Pcalc-${version}.apk" $flags --verify-tag \
            --title "Pcalc ${version}" \
            --notes "Pcalc ${version}, with rr-calc $(git -C rr-calc rev-parse --short HEAD). Download Pcalc-${version}.apk on the device and open it to install."
